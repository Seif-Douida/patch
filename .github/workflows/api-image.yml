name: api-image

# Phase 0 precursor of deploy.yml (spec §13): build the API image, push it to GHCR, roll pp-api.
on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "pyproject.toml"
      - "uv.lock"
      - "Dockerfile"
      - ".dockerignore"
      - ".github/workflows/api-image.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: api-image
  cancel-in-progress: false

# `shell: bash` runs with -eo pipefail.
defaults:
  run:
    shell: bash

env:
  IMAGE: ghcr.io/seif-douida/patchpulse-api
  RG: rg-patchpulse
  APP: pp-api

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=sha,format=long,prefix=
            type=raw,value=latest

      - uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: APP_VERSION=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: production
    # Shared with infra's deploy, which redeploys pp-api's running image (see infra.yml).
    concurrency:
      group: pp-api-deploy
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: azure/login@v3
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Point pp-api at this commit's image
        id: update
        run: |
          # `list` returns empty only when pp-api is absent, and fails on real Azure errors.
          id=$(az containerapp list -g "$RG" --query "[?name=='$APP'].id | [0]" -o tsv)
          if [ -z "$id" ]; then
            echo "::notice::pp-api does not exist yet. Image pushed; run infra.yml to create the app."
            echo "deployed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # A stopped app means cost-guard tripped (ADR-017); only infra.yml brings it back.
          status=$(az containerapp show --ids "$id" --query properties.runningStatus -o tsv)
          if [ "$status" = "Stopped" ]; then
            echo "::error::pp-api is stopped by cost-guard. Fix the cause, run infra (what_if_only unticked) to start it, then re-run this workflow; the image is already pushed."
            exit 1
          fi
          az containerapp update -g "$RG" -n "$APP" --image "$IMAGE:$GITHUB_SHA" -o none
          fqdn=$(az containerapp show -g "$RG" -n "$APP" --query properties.configuration.ingress.fqdn -o tsv)
          echo "fqdn=$fqdn" >> "$GITHUB_OUTPUT"
          echo "deployed=true" >> "$GITHUB_OUTPUT"

      - name: Smoke test /health reports this commit
        if: steps.update.outputs.deployed == 'true'
        env:
          FQDN: ${{ steps.update.outputs.fqdn }}
        run: |
          for attempt in 1 2 3 4 5 6; do
            if curl -fsS --max-time 30 "https://$FQDN/health" -o health.json \
              && grep -q "\"version\":\"$GITHUB_SHA\"" health.json; then
              cat health.json
              exit 0
            fi
            echo "attempt $attempt: not ready yet"
            sleep 20
          done
          echo "::error::/health did not report version $GITHUB_SHA"
          exit 1
