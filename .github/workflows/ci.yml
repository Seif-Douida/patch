name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# `shell: bash` runs with -eo pipefail, so a failing command piped into tee fails the step.
defaults:
  run:
    shell: bash

env:
  BICEP_VERSION: v0.47.16
  SQL_IMAGE: mcr.microsoft.com/mssql/server:2025-CU9-ubuntu-24.04

jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@v10.2.0
        with:
          version: "0.12.19"
          enable-cache: true

      # mssql-python's documented Linux requirements.
      - name: Install SQL driver libraries
        run: sudo apt-get install -y --no-install-recommends libltdl7 libkrb5-3 libgssapi-krb5-2

      - name: Install Bicep CLI
        run: |
          mkdir -p "$RUNNER_TEMP/bin"
          curl -fsSL -o "$RUNNER_TEMP/bin/bicep" \
            "https://github.com/Azure/bicep/releases/download/${BICEP_VERSION}/bicep-linux-x64"
          chmod +x "$RUNNER_TEMP/bin/bicep"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy

      - name: Bicep lint (any warning fails the build)
        run: |
          bicep lint infra/main.bicep 2>&1 | tee bicep-lint.txt
          if grep -Eq "Warning|Error" bicep-lint.txt; then exit 1; fi

      - name: Tests, including the $0 infra guard
        run: uv run pytest -m "not integration"

  # Integration tests against SQL Server on the runner. This is a throwaway container; CI never
  # connects to Azure SQL (spec §5).
  integration:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@v10.2.0
        with:
          version: "0.12.19"
          enable-cache: true

      - name: Install SQL driver libraries
        run: sudo apt-get install -y --no-install-recommends libltdl7 libkrb5-3 libgssapi-krb5-2

      - name: Start SQL Server (password generated for this run)
        run: |
          password="Ci1-$(openssl rand -hex 16)"
          echo "::add-mask::$password"
          echo "PP_TEST_SA_PASSWORD=$password" >> "$GITHUB_ENV"
          docker run -d --name sql -p 1433:1433 \
            -e ACCEPT_EULA=Y -e MSSQL_PID=Developer -e "MSSQL_SA_PASSWORD=$password" \
            --health-cmd "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P \"\$MSSQL_SA_PASSWORD\" -Q 'SELECT 1' -b -o /dev/null" \
            --health-interval 10s --health-retries 12 --health-start-period 20s \
            "$SQL_IMAGE"
          for attempt in $(seq 1 30); do
            if [ "$(docker inspect -f '{{.State.Health.Status}}' sql)" = "healthy" ]; then
              exit 0
            fi
            sleep 5
          done
          docker logs sql | tail -20
          exit 1

      - run: uv sync --locked
      - run: uv run pytest -m integration
