name: cost-guard

# $0 kill switch (ADR-017). Every 15 min: read month-to-date cost, pp-api usage and the jobs'
# executions (they share the grant, ADR-009); if a limit is crossed, delete pp-nightly, stop pp-api
# (ingress off, app stopped, 0 replicas) and open or update a GitHub issue labelled `alert`
# (ADR-013). Azure lookups fail closed: an Azure error fails the run instead of looking like zero
# usage.
on:
  # GitHub drops scheduled runs under load (2 of ~19 hourly runs happened on 2026-09-28), so ask
  # four times an hour, away from the busy top of the hour.
  schedule:
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Evaluate and open the issue, but never stop pp-api"
        type: boolean
        default: true
      cost_threshold:
        description: "Override the cost threshold for this run (e.g. -1 to force a trip)"
        type: string
        default: ""

permissions:
  contents: read
  id-token: write
  issues: write

concurrency:
  group: cost-guard
  cancel-in-progress: false

# `shell: bash` runs with -eo pipefail.
defaults:
  run:
    shell: bash

jobs:
  guard:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: production
    env:
      RG: rg-patchpulse
      APP: pp-api
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@v10.2.0
        with:
          version: "0.12.19"

      - uses: azure/login@v3
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Month-to-date cost of rg-patchpulse (Cost Management, lags up to 72 hours)
        id: cost
        continue-on-error: true
        env:
          SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
        run: |
          # Scoped to PatchPulse's resource group: the kill switch can only stop pp-api, so it only
          # counts PatchPulse's spending. Other spending in the subscription is the $1 budget's job.
          # Cost Management throttles (429 "Too many requests"), so retry before giving up.
          for attempt in 1 2 3; do
            if az rest --method post \
              --url "https://management.azure.com/subscriptions/$SUBSCRIPTION_ID/resourceGroups/$RG/providers/Microsoft.CostManagement/query?api-version=2023-11-01" \
              --body '{"type":"ActualCost","timeframe":"MonthToDate","dataset":{"granularity":"None","aggregation":{"totalCost":{"name":"Cost","function":"Sum"}}}}' \
              > cost.json; then
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then
              echo "attempt $attempt failed; retrying in $((attempt * 30)) s"
              sleep $((attempt * 30))
            fi
          done
          exit 1

      - name: pp-api replica-minutes this month (Azure Monitor metrics, near real time)
        run: |
          # Both ends are required: with only --start-time, az queries start + 1h (--offset default).
          start=$(date -u +%Y-%m-01T00:00:00+00:00)
          end=$(date -u +%Y-%m-%dT%H:%M:%S+00:00)
          # `list` returns empty only when pp-api is absent, and fails on real Azure errors.
          id=$(az containerapp list -g "$RG" --query "[?name=='$APP'].id | [0]" -o tsv)
          if [ -z "$id" ]; then
            echo '{"value": []}' > replicas.json
            exit 0
          fi
          # Azure samples Replicas about twice a minute, so the per-minute Average is the replica
          # count and a Total would double-count. A 1m query spans up to 31 days: a whole month.
          az monitor metrics list --resource "$id" --metrics Replicas --aggregation Average \
            --interval 1m --start-time "$start" --end-time "$end" -o json > replicas.json

      - name: Job executions this month (pp-nightly, pp-migrate)
        id: executions
        run: |
          # `list` returns empty only when the job is absent (not created yet, or deleted by a
          # trip), and fails on real Azure errors. Azure keeps each job's recent executions.
          for job in pp-nightly pp-migrate; do
            exists=$(az containerapp job list -g "$RG" --query "[?name=='$job'] | length(@)" -o tsv)
            if [ "$exists" = "0" ]; then
              echo '[]' > "$job-executions.json"
            else
              az containerapp job execution list -g "$RG" -n "$job" -o json > "$job-executions.json"
            fi
          done

      - name: Evaluate
        id: guard
        env:
          COST_OK: ${{ steps.cost.outcome == 'success' }}
          THRESHOLD: ${{ inputs.cost_threshold || vars.COST_GUARD_THRESHOLD || '0' }}
        run: |
          cost_args=()
          if [ "$COST_OK" = "true" ]; then cost_args=(--cost cost.json); fi
          uv run --no-dev python -m patchpulse.monitoring.cost_guard "${cost_args[@]}" \
            --replicas replicas.json --vcpu-per-replica 0.5 --cost-threshold "$THRESHOLD" \
            --job-executions pp-nightly-executions.json --job-executions pp-migrate-executions.json
          cat cost-guard-summary.md >> "$GITHUB_STEP_SUMMARY"

      # First, so a failure to stop pp-api can't leave the nightly job scheduled. pp-migrate needs no
      # action: only deploy.yml starts it, and deploy.yml refuses while pp-api is stopped.
      - name: Trip - delete pp-nightly
        id: trip_jobs
        if: steps.guard.outputs.tripped == 'true' && !(github.event_name == 'workflow_dispatch' && inputs.dry_run)
        run: |
          # A scheduled job can't be paused, only deleted; infra.yml recreates it (ADR-009).
          exists=$(az containerapp job list -g "$RG" --query "[?name=='pp-nightly'] | length(@)" -o tsv)
          if [ "$exists" = "0" ]; then
            echo "already_deleted=true" >> "$GITHUB_OUTPUT"
          else
            echo "already_deleted=false" >> "$GITHUB_OUTPUT"
            az containerapp job delete -g "$RG" -n pp-nightly --yes -o none
          fi
          left=$(az containerapp job list -g "$RG" --query "[?name=='pp-nightly'] | length(@)" -o tsv)
          if [ "$left" != "0" ]; then
            echo "::error::pp-nightly still exists after the delete"
            exit 1
          fi
          echo "action=pp-nightly is deleted (infra.yml recreates it)." >> "$GITHUB_OUTPUT"

      - name: Trip - stop pp-api
        id: trip
        if: "!cancelled() && steps.guard.outputs.tripped == 'true' && !(github.event_name == 'workflow_dispatch' && inputs.dry_run)"
        run: |
          id=$(az containerapp list -g "$RG" --query "[?name=='$APP'].id | [0]" -o tsv)
          if [ -z "$id" ]; then
            echo "action=pp-api does not exist; nothing to stop." >> "$GITHUB_OUTPUT"
            exit 0
          fi
          fqdn=$(az containerapp show --ids "$id" --query properties.configuration.ingress.fqdn -o tsv)
          status=$(az containerapp show --ids "$id" --query properties.runningStatus -o tsv)
          # A trip that persists finds pp-api already off every run; the issue step then stays quiet.
          if [ -z "$fqdn" ] && [ "$status" = "Stopped" ]; then
            echo "already_stopped=true" >> "$GITHUB_OUTPUT"
          else
            echo "already_stopped=false" >> "$GITHUB_OUTPUT"
          fi
          # Disabling ingress alone restarted pp-api and left a replica running for 4.5 hours
          # (drill, 2026-09-28), so ingress goes first and the app-level stop comes after it.
          if [ -n "$fqdn" ]; then
            az containerapp ingress disable -g "$RG" -n "$APP" -o none
          fi
          status=$(az containerapp show --ids "$id" --query properties.runningStatus -o tsv)
          if [ "$status" != "Stopped" ]; then
            az rest --method post \
              --url "https://management.azure.com$id/stop?api-version=2025-07-01" -o none
          fi
          # The stop is asynchronous: wait until the app is Stopped and no revision has replicas.
          for attempt in $(seq 1 16); do
            status=$(az containerapp show --ids "$id" --query properties.runningStatus -o tsv)
            # shellcheck disable=SC2016 # the backticks are a JMESPath literal, not a shell expansion
            busy=$(az containerapp revision list -g "$RG" -n "$APP" \
              --query 'length([?properties.replicas > `0`])' -o tsv)
            echo "attempt $attempt: runningStatus=$status, revisions with replicas=$busy"
            if [ "$status" = "Stopped" ] && [ "$busy" = "0" ]; then break; fi
            sleep 15
          done
          after=$(az containerapp show --ids "$id" --query properties.configuration.ingress.fqdn -o tsv)
          if [ "$status" != "Stopped" ] || [ "$busy" != "0" ] || [ -n "$after" ]; then
            echo "::error::pp-api is not fully off: runningStatus=$status, revisions with replicas=$busy, ingress fqdn='$after'"
            exit 1
          fi
          echo "action=pp-api is stopped (0 replicas) and its ingress is disabled." >> "$GITHUB_OUTPUT"
          echo "::warning::pp-api stopped by cost-guard"

      - name: Open or update the alert issue
        if: always() && steps.guard.outputs.tripped == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TRIP_OUTCOME: ${{ steps.trip.outcome }}
          TRIP_ACTION: ${{ steps.trip.outputs.action }}
          ALREADY_STOPPED: ${{ steps.trip.outputs.already_stopped }}
          JOBS_OUTCOME: ${{ steps.trip_jobs.outcome }}
          JOBS_ACTION: ${{ steps.trip_jobs.outputs.action }}
          ALREADY_DELETED: ${{ steps.trip_jobs.outputs.already_deleted }}
        run: |
          case "$TRIP_OUTCOME" in
            success) action="$TRIP_ACTION" ;;
            skipped) action="Dry run: pp-api left running." ;;
            *) action="FAILED to stop pp-api. Check the run log and stop it by hand." ;;
          esac
          case "$JOBS_OUTCOME" in
            success) nightly_action="$JOBS_ACTION" ;;
            skipped) nightly_action="Dry run: pp-nightly left in place." ;;
            *) nightly_action="FAILED to delete pp-nightly. Check the run log and delete it by hand." ;;
          esac
          { cat cost-guard-summary.md; echo; echo "**Action:** $action $nightly_action"; echo; echo "Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"; } > issue-body.md
          title="cost-guard tripped"
          gh label create alert --color B60205 --description "Automated alert (ADR-013)" --force
          number=$(gh issue list --label alert --state open --search "\"$title\" in:title" \
            --json number --jq '.[0].number // empty')
          if [ -n "$number" ] && [ "$TRIP_OUTCOME" = "success" ] && [ "$ALREADY_STOPPED" = "true" ] \
            && [ "$JOBS_OUTCOME" = "success" ] && [ "$ALREADY_DELETED" = "true" ]; then
            echo "pp-api was already stopped, pp-nightly already deleted and issue #$number is open; not commenting again."
          elif [ -n "$number" ]; then
            gh issue comment "$number" --body-file issue-body.md
          else
            gh issue create --title "$title" --label alert --body-file issue-body.md
          fi

      # A backstop, not part of the kill switch: pp-nightly reports its own failures, but not when
      # it can't reach GitHub (a broken app key, 2026-10-06). Runs whatever the trip steps did.
      - name: Check the last nightly run
        id: nightly
        if: "!cancelled() && steps.executions.outcome == 'success'"
        run: uv run --no-dev python -m patchpulse.monitoring.nightly_watch pp-nightly-executions.json

      - name: Open the nightly failure issue
        if: "!cancelled() && steps.nightly.outputs.failed == 'true'"
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          # The title the next successful night closes. If one is open (the run reported itself,
          # or an earlier check did), leave it: it stays open until a night succeeds.
          title="pipeline failed: nightly"
          number=$(gh issue list --label alert --state open --limit 100 --json number,title \
            --jq "[.[] | select(.title == \"$title\")][0].number // empty")
          if [ -n "$number" ]; then
            echo "Issue #$number is already open; not opening another."
            exit 0
          fi
          gh label create alert --color B60205 --description "Automated alert (ADR-013)" --force
          gh issue create --title "$title" --label alert --body-file nightly-issue.md

      - name: Fail loudly if month-to-date cost was unavailable
        if: always() && (steps.cost.outcome == 'failure' || steps.guard.outputs.cost_available == 'false')
        run: |
          echo "::error::Month-to-date cost was unavailable (query failed or unreadable), so only the usage checks ran. Expected for the first 48 hours of a new subscription."
          exit 1
