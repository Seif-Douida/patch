name: cost-guard

# $0 kill switch (ADR-017). Every hour: read month-to-date cost and pp-api usage; if a limit is
# crossed, disable pp-api ingress and open or update a GitHub issue labelled `alert` (ADR-013).
# Azure lookups fail closed: an Azure error fails the run instead of looking like zero usage.
on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Evaluate and open the issue, but never disable ingress"
        type: boolean
        default: true
      cost_threshold:
        description: "Override the cost threshold for this run (e.g. -1 to force a trip)"
        type: string
        default: ""

permissions:
  contents: read
  id-token: write
  issues: write

concurrency:
  group: cost-guard
  cancel-in-progress: false

# `shell: bash` runs with -eo pipefail.
defaults:
  run:
    shell: bash

jobs:
  guard:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: production
    env:
      RG: rg-patchpulse
      APP: pp-api
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@v10.2.0
        with:
          version: "0.12.19"

      - uses: azure/login@v3
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Month-to-date cost (Cost Management, lags up to 72 hours)
        id: cost
        continue-on-error: true
        env:
          SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
        run: |
          az rest --method post \
            --url "https://management.azure.com/subscriptions/$SUBSCRIPTION_ID/providers/Microsoft.CostManagement/query?api-version=2023-11-01" \
            --body '{"type":"ActualCost","timeframe":"MonthToDate","dataset":{"granularity":"None","aggregation":{"totalCost":{"name":"Cost","function":"Sum"}}}}' \
            > cost.json

      - name: pp-api usage this month (Azure Monitor metrics, near real time)
        run: |
          # Both ends are required: with only --start-time, az queries start + 1h (--offset default).
          start=$(date -u +%Y-%m-01T00:00:00+00:00)
          end=$(date -u +%Y-%m-%dT%H:%M:%S+00:00)
          # `list` returns empty only when pp-api is absent, and fails on real Azure errors.
          id=$(az containerapp list -g "$RG" --query "[?name=='$APP'].id | [0]" -o tsv)
          if [ -z "$id" ]; then
            echo '{"value": []}' > replicas.json
            echo '{"value": []}' > requests.json
            exit 0
          fi
          az monitor metrics list --resource "$id" --metrics Replicas --aggregation Total \
            --interval 1h --start-time "$start" --end-time "$end" -o json > replicas.json
          az monitor metrics list --resource "$id" --metrics Requests --aggregation Total \
            --interval 1h --start-time "$start" --end-time "$end" -o json > requests.json

      - name: Evaluate
        id: guard
        env:
          COST_OK: ${{ steps.cost.outcome == 'success' }}
          THRESHOLD: ${{ inputs.cost_threshold || vars.COST_GUARD_THRESHOLD || '0' }}
        run: |
          cost_args=()
          if [ "$COST_OK" = "true" ]; then cost_args=(--cost cost.json); fi
          uv run --no-dev python -m patchpulse.monitoring.cost_guard "${cost_args[@]}" \
            --replicas replicas.json --requests requests.json \
            --vcpu-per-replica 0.5 --cost-threshold "$THRESHOLD"
          cat cost-guard-summary.md >> "$GITHUB_STEP_SUMMARY"

      - name: Trip - disable pp-api ingress
        id: trip
        if: steps.guard.outputs.tripped == 'true' && !(github.event_name == 'workflow_dispatch' && inputs.dry_run)
        run: |
          id=$(az containerapp list -g "$RG" --query "[?name=='$APP'].id | [0]" -o tsv)
          if [ -z "$id" ]; then
            echo "action=pp-api does not exist; nothing to disable." >> "$GITHUB_OUTPUT"
            exit 0
          fi
          fqdn=$(az containerapp show --ids "$id" --query properties.configuration.ingress.fqdn -o tsv)
          if [ -n "$fqdn" ]; then
            az containerapp ingress disable -g "$RG" -n "$APP" -o none
          fi
          after=$(az containerapp show --ids "$id" --query properties.configuration.ingress.fqdn -o tsv)
          if [ -n "$after" ]; then
            echo "::error::pp-api ingress is still enabled after the disable call"
            exit 1
          fi
          echo "action=pp-api ingress is disabled." >> "$GITHUB_OUTPUT"
          echo "::warning::pp-api ingress disabled by cost-guard"

      - name: Open or update the alert issue
        if: always() && steps.guard.outputs.tripped == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TRIP_OUTCOME: ${{ steps.trip.outcome }}
          TRIP_ACTION: ${{ steps.trip.outputs.action }}
        run: |
          case "$TRIP_OUTCOME" in
            success) action="$TRIP_ACTION" ;;
            skipped) action="Dry run: ingress left enabled." ;;
            *) action="FAILED to disable pp-api ingress. Check the run log and disable it by hand." ;;
          esac
          { cat cost-guard-summary.md; echo; echo "**Action:** $action"; echo; echo "Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"; } > issue-body.md
          title="cost-guard tripped"
          gh label create alert --color B60205 --description "Automated alert (ADR-013)" --force
          number=$(gh issue list --label alert --state open --search "\"$title\" in:title" \
            --json number --jq '.[0].number // empty')
          if [ -n "$number" ]; then
            gh issue comment "$number" --body-file issue-body.md
          else
            gh issue create --title "$title" --label alert --body-file issue-body.md
          fi

      - name: Fail loudly if month-to-date cost was unavailable
        if: always() && (steps.cost.outcome == 'failure' || steps.guard.outputs.cost_available == 'false')
        run: |
          echo "::error::Month-to-date cost was unavailable (query failed or unreadable), so only the usage checks ran. Expected for the first 48 hours of a new subscription."
          exit 1
