name: infra

on:
  push:
    branches: [main]
    paths:
      - "infra/**"
      - "tests/infra/**"
      - ".github/workflows/infra.yml"
  workflow_dispatch:
    inputs:
      what_if_only:
        description: "Preview the changes (what-if) without deploying"
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: infra
  cancel-in-progress: false

# `shell: bash` runs with -eo pipefail, so a failed deployment piped into tee fails the step.
defaults:
  run:
    shell: bash

env:
  BICEP_VERSION: v0.47.16
  RG: rg-patchpulse

jobs:
  # The $0 guard must pass before anything is deployed (ADR-017, layer 2).
  guard:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@v10.2.0
        with:
          version: "0.12.19"

      - name: Install Bicep CLI
        run: |
          mkdir -p "$RUNNER_TEMP/bin"
          curl -fsSL -o "$RUNNER_TEMP/bin/bicep" \
            "https://github.com/Azure/bicep/releases/download/${BICEP_VERSION}/bicep-linux-x64"
          chmod +x "$RUNNER_TEMP/bin/bicep"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

      - run: uv sync --locked

      - name: Bicep lint (any warning fails)
        run: |
          bicep lint infra/main.bicep 2>&1 | tee bicep-lint.txt
          if grep -Eq "Warning|Error" bicep-lint.txt; then exit 1; fi

      - name: $0 guard test
        run: uv run pytest tests/infra -q

  deploy:
    needs: guard
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: production
    # Shared with deploy.yml: this job reads the running images and redeploys them, so an image roll
    # in between would be undone.
    concurrency:
      group: pp-api-deploy
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: azure/login@v3
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Require the Phase 1 secrets
        env:
          SQL_WRITER_PASSWORD: ${{ secrets.SQL_WRITER_PASSWORD }}
          AUTHOR_HASH_SALT: ${{ secrets.AUTHOR_HASH_SALT }}
          ALERT_EMAIL: ${{ secrets.ALERT_EMAIL }}
        run: |
          # An empty secret would reach Azure as an empty pp_writer password, hash salt or alert
          # address.
          missing=""
          [ -n "$SQL_WRITER_PASSWORD" ] || missing="$missing SQL_WRITER_PASSWORD"
          [ -n "$AUTHOR_HASH_SALT" ] || missing="$missing AUTHOR_HASH_SALT"
          [ -n "$ALERT_EMAIL" ] || missing="$missing ALERT_EMAIL"
          if [ -n "$missing" ]; then
            echo "::error::Add these secrets to the GitHub environment 'production':$missing"
            exit 1
          fi

      - name: Choose the images (keep the running ones; else require a public :latest)
        run: |
          # A public :latest is the only image infra may introduce; deploy.yml rolls images.
          require_public() {
            if ! docker manifest inspect "$1" > /dev/null 2>&1; then
              echo "::error::$2 does not exist yet and $1 is not publicly pullable. Wait for deploy to finish, make the package public (runbook step 11), then re-run infra."
              exit 1
            fi
          }
          # `list` returns empty only when the resource is absent, and fails on real Azure errors.
          id=$(az containerapp list -g "$RG" --query "[?name=='pp-api'].id | [0]" -o tsv)
          if [ -n "$id" ]; then
            api=$(az containerapp show --ids "$id" --query "properties.template.containers[0].image" -o tsv)
          else
            api=ghcr.io/seif-douida/patchpulse-api:latest
            require_public "$api" pp-api
          fi
          # pp-nightly is updated last by deploy.yml, so its image is the one both jobs should run.
          id=$(az containerapp job list -g "$RG" --query "[?name=='pp-nightly'].id | [0]" -o tsv)
          if [ -n "$id" ]; then
            jobs=$(az containerapp job show --ids "$id" --query "properties.template.containers[0].image" -o tsv)
          else
            jobs=ghcr.io/seif-douida/patchpulse-jobs:latest
            require_public "$jobs" pp-nightly
          fi
          {
            echo "API_IMAGE=$api"
            echo "JOBS_IMAGE=$jobs"
          } >> "$GITHUB_ENV"

      - name: What-if (preview of every change)
        env:
          SQL_ADMIN_PASSWORD: ${{ secrets.SQL_ADMIN_PASSWORD }}
          SQL_ENTRA_ADMIN_LOGIN: ${{ secrets.SQL_ENTRA_ADMIN_LOGIN }}
          SQL_ENTRA_ADMIN_OBJECT_ID: ${{ secrets.SQL_ENTRA_ADMIN_OBJECT_ID }}
          DEV_IP_ADDRESS: ${{ secrets.DEV_IP_ADDRESS }}
          SQL_WRITER_PASSWORD: ${{ secrets.SQL_WRITER_PASSWORD }}
          AUTHOR_HASH_SALT: ${{ secrets.AUTHOR_HASH_SALT }}
          ALERT_EMAIL: ${{ secrets.ALERT_EMAIL }}
        run: |
          az deployment group what-if -g "$RG" --name "infra-$GITHUB_RUN_ID" \
            --parameters infra/main.bicepparam

      - name: Deploy
        if: github.event_name != 'workflow_dispatch' || !inputs.what_if_only
        env:
          SQL_ADMIN_PASSWORD: ${{ secrets.SQL_ADMIN_PASSWORD }}
          SQL_ENTRA_ADMIN_LOGIN: ${{ secrets.SQL_ENTRA_ADMIN_LOGIN }}
          SQL_ENTRA_ADMIN_OBJECT_ID: ${{ secrets.SQL_ENTRA_ADMIN_OBJECT_ID }}
          DEV_IP_ADDRESS: ${{ secrets.DEV_IP_ADDRESS }}
          SQL_WRITER_PASSWORD: ${{ secrets.SQL_WRITER_PASSWORD }}
          AUTHOR_HASH_SALT: ${{ secrets.AUTHOR_HASH_SALT }}
          ALERT_EMAIL: ${{ secrets.ALERT_EMAIL }}
        run: |
          az deployment group create -g "$RG" --name "infra-$GITHUB_RUN_ID" \
            --parameters infra/main.bicepparam \
            --query properties.outputs -o json | tee outputs.json
          {
            echo "## Deployment outputs"
            echo '```json'
            cat outputs.json
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # Recovery after a cost-guard trip (ADR-017): Deploy restored ingress; now start the app.
      - name: Start pp-api if cost-guard stopped it
        if: github.event_name != 'workflow_dispatch' || !inputs.what_if_only
        run: |
          id=$(az containerapp list -g "$RG" --query "[?name=='pp-api'].id | [0]" -o tsv)
          status=$(az containerapp show --ids "$id" --query properties.runningStatus -o tsv)
          if [ "$status" != "Stopped" ]; then
            echo "pp-api runningStatus=$status; nothing to start."
            exit 0
          fi
          az rest --method post \
            --url "https://management.azure.com$id/start?api-version=2025-07-01" -o none
          for attempt in $(seq 1 16); do
            status=$(az containerapp show --ids "$id" --query properties.runningStatus -o tsv)
            echo "attempt $attempt: runningStatus=$status"
            if [ "$status" = "Running" ]; then break; fi
            sleep 15
          done
          if [ "$status" != "Running" ]; then
            echo "::error::pp-api did not start: runningStatus=$status"
            exit 1
          fi
          echo "::notice::pp-api started again after a cost-guard stop."
