name: uptime

# Phase 7 (design D9): every 6 hours, at an off-peak minute, call pp-api's /health and read how old
# the published site's data is. "pp-api down" and "data stale" (config/alerts.yaml) are opened and
# closed with GITHUB_TOKEN. No Azure login and no SQL: the API's and the site's addresses are
# public (repository variables PP_API_URL and PP_SITE_URL). A wake costs pp-api ~50 vCPU-s;
# ~120 a month is the 6,000 vCPU-s ADR-017 set aside.
on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: uptime
  cancel-in-progress: false

# `shell: bash` runs with -eo pipefail.
defaults:
  run:
    shell: bash

jobs:
  uptime:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@v10.2.0
        with:
          version: "0.12.19"

      - name: Call /health
        id: health
        env:
          API_URL: ${{ vars.PP_API_URL }}
        run: |
          # A stray space or line break in the variable makes curl refuse the URL (19 Nov).
          API_URL=$(printf '%s' "$API_URL" | tr -d '[:space:]')
          API_URL="${API_URL%/}"
          if [ -z "$API_URL" ]; then
            echo "::error::Set the repository variable PP_API_URL (https://<pp-api's address>)."
            exit 1
          fi
          # Two tries of 60 s: a cold start takes ~23 s.
          status=down
          for try in 1 2; do
            if curl --silent --show-error --fail --max-time 60 "$API_URL/health" > /dev/null; then
              status=ok
              break
            fi
            echo "try $try: no answer"
          done
          echo "status=$status" >> "$GITHUB_OUTPUT"

      - name: Read the published data's index
        env:
          SITE_URL: ${{ vars.PP_SITE_URL }}
        run: |
          SITE_URL=$(printf '%s' "$SITE_URL" | tr -d '[:space:]')
          SITE_URL="${SITE_URL%/}"
          if [ -z "$SITE_URL" ]; then
            echo "::error::Set the repository variable PP_SITE_URL (https://<the site's address>)."
            exit 1
          fi
          # An index that cannot be read raises "data stale" (the site is gone or a publish broke it).
          curl --silent --show-error --fail --max-time 60 -o index.json "$SITE_URL/data/index.json" \
            || echo "::warning::$SITE_URL/data/index.json could not be read."

      - name: Evaluate
        env:
          HEALTH: ${{ steps.health.outputs.status }}
        run: |
          uv run --no-dev --group pipeline python -m patchpulse.monitoring.uptime \
            --health "$HEALTH" --index index.json --out uptime-plan

      - name: Open or close the issues
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: bash .github/scripts/apply-issue-plan.sh uptime-plan
