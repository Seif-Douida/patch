# Teacher candidates on the free-tier Gemini API (spec §7.3; no billing on the project: C2).
# Limits (requests a minute, tokens a minute, requests a day) are from Seif's AI Studio dashboard on
# 2026-10-06 (docs/budget.md). They are per project, so PatchPulse uses only `use_fraction` of each.
# `id`, `json_mode` and `system_instruction` are what the Gemini API accepted in the live smoke test
# (plan Task 7, 2026-10-10): all three accept both. Gemma 4 31B's JSON mode isn't strict (it added a
# stray code fence after valid JSON), so answers are always parsed and validated.
candidates:
  gemma-4-31b:
    id: gemma-4-31b-it
    rpm: 30
    tpm: 16000
    rpd: 14400
    json_mode: true
    system_instruction: true
    use_fraction: 0.5
  gemma-4-26b-a4b:
    id: gemma-4-26b-a4b-it
    rpm: 30
    tpm: 16000
    rpd: 14400
    json_mode: true
    system_instruction: true
    use_fraction: 0.5
  # The agent's chain (Phase 5, design D8): Phase 2's half-split ends, so each uses its whole
  # quota. 3.1 Flash Lite's limits are from the AI Studio dashboard (Seif, 25 Oct 2026); both
  # answered every request of the 25 Oct probe.
  gemini-3.5-flash-lite:
    id: gemini-3.5-flash-lite
    rpm: 15
    tpm: 250000
    rpd: 500
    json_mode: true
    system_instruction: true
    use_fraction: 1.0
  gemini-3.1-flash-lite:
    id: gemini-3.1-flash-lite
    rpm: 15
    tpm: 250000
    rpd: 500
    json_mode: true
    system_instruction: true
    use_fraction: 1.0
  # The bake-off winner's model, self-hosted on an OpenAI-style server with no rate limits
  # (ADR-020). Its address and key are PP_LLM_SERVER_URL and PP_LLM_SERVER_KEY in .env. On gold dev
  # it tied Google's copy (macro-F1 0.890 vs 0.886; 137 of 150 label sets identical, 2026-10-12).
  selfhosted-gemma-4-31b:
    provider: openai_compat
    id: gemma-31b
    json_mode: true
    system_instruction: true

# The bake-off winner was gemma-4-31b (plan Task 9, 2026-10-12, reports/aspects/teacher-bakeoff.md).
# Google's free tier kept failing it, so the silver set is labeled by the same model self-hosted.
teacher: selfhosted-gemma-4-31b

# The Phase 5 agent tries these in order (design D8); Gemma 4 stays out of the chain (the probe:
# 1 of 10 answers from 31B, 26B ran to its output limit).
agent:
  chain: [gemini-3.5-flash-lite, gemini-3.1-flash-lite]
