# PatchPulse dbt project (spec §6.4). dbt owns stg, core and mart; Alembic owns raw and ops.
# The schemas exist before dbt runs (migration 0001), so the writer never needs CREATE SCHEMA.
name: patchpulse
version: "1.0.0"
config-version: 2
profile: patchpulse

model-paths: ["models"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
test-paths: ["tests"]
clean-targets: ["target"]

vars:
  # The patch classifier version whose labels feed core.fact_patch.
  classifier_version: rules-v1
  # Aspect taxonomy v1 in its fixed order (patchpulse.labeling.taxonomy.ASPECTS, seeds/aspects.csv):
  # the p_<code> and l_<code> columns of raw.review_aspect_score.
  aspects:
    - performance
    - stability_bugs
    - gameplay_balance
    - content
    - monetization
    - online_servers
    - story_world
    - ux_controls
    - platform_policy
    - off_topic
  # Phase 3's index rules (design D1; patchpulse.retrieval.rules holds the same values): which
  # reviews Qdrant holds. Long enough (words, or characters where words aren't spaced), then a
  # game's most recent plus the reviews around its treatment patches and its launch. A new version
  # of the rules means a new collection.
  index_min_words: 20
  index_char_languages: [schinese, tchinese, japanese, thai]
  index_min_chars: 40
  index_cap_per_game: 40000
  index_patch_window_days: 30
  index_rules_version: r1

models:
  patchpulse:
    staging:
      +schema: stg
      +materialized: view
    core:
      +schema: core
      +materialized: table
    marts:
      +schema: mart
      +materialized: table

seeds:
  patchpulse:
    +schema: core
    steam_sale_calendar:
      +column_types:
        sale_name: nvarchar(100)
        start_date: date
        end_date: date
        source_url: nvarchar(300)
    languages:
      +column_types:
        code: nvarchar(32)
        name: nvarchar(64)
    aspects:
      +column_types:
        code: nvarchar(32)
        name: nvarchar(64)
        description: nvarchar(200)
        taxonomy_version: nvarchar(8)

flags:
  send_anonymous_usage_stats: false
