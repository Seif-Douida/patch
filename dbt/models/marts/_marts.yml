version: 2

models:
  - name: daily_game_sentiment
    description: One row per game per day with the positive share and its Wilson 90% interval.
    data_tests:
      - unique_combination:
          arguments:
            columns: [game_key, date_key]
    columns:
      - name: n_reviews
        data_tests:
          - not_null
          - daily_volume_anomaly
      - name: pos_share
        data_tests: [between_0_and_1]
      - name: pos_lo90
        data_tests: [between_0_and_1]
      - name: pos_hi90
        data_tests: [between_0_and_1]
      - name: share_new_players
        data_tests: [between_0_and_1]

  - name: daily_aspect_share
    description: >-
      One row per game, day with reviews and aspect: mentions among the day's negative and
      positive reviews, out of the scored ones.
    data_tests:
      - unique_combination:
          arguments:
            columns: [game_key, date_key, aspect_key]
      - mentions_within_scored
    columns:
      - name: game_key
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_game')
                field: game_key
      - name: aspect_key
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_aspect')
                field: aspect_key
      - name: share_of_negative
        data_tests: [between_0_and_1]
      - name: share_of_positive
        data_tests: [between_0_and_1]

  - name: daily_playtime_sentiment
    description: >-
      One row per game, day and playtime bucket at review: reviews and positive reviews (Phase 4's
      decompose_change). Its buckets add up to daily_game_sentiment.n_reviews
      (tests/playtime_buckets_sum_to_daily_reviews.sql).
    data_tests:
      - unique_combination:
          arguments:
            columns: [game_key, date_key, playtime_bucket]
    columns:
      - name: game_key
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_game')
                field: game_key
      - name: date_key
        data_tests: [not_null]
      - name: playtime_bucket
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [lt_2h, 2h_10h, 10h_50h, 50h_200h, 200h_plus, unknown]
      - name: n_reviews
        data_tests: [not_null]
      - name: n_positive
        data_tests: [not_null]

  - name: daily_comparison_counts
    description: >-
      One row per comparison game (role donor) and UTC day: positive and negative reviews from
      Steam's per-day counts, the seed's history and the nightly counts stage's days (Phase 4,
      design D4). Synthetic control's comparison games read these.
    data_tests:
      - unique_combination:
          arguments:
            columns: [game_key, date_key]
    columns:
      - name: game_key
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_game')
                field: game_key
      - name: date_key
        data_tests: [not_null]
      - name: n_positive
        data_tests: [not_null]
      - name: n_negative
        data_tests: [not_null]
      - name: n_reviews
        data_tests: [not_null]

  - name: patch_window
    description: Descriptive before/after aggregates per treatment candidate (not causal).
    columns:
      - name: patch_id
        data_tests: [unique, not_null]
