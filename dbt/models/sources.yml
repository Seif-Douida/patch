version: 2

sources:
  - name: raw
    description: Landing tables written by the pipeline (Alembic migration 0001).
    schema: raw
    tables:
      - name: game
      - name: steam_review
        description: One row per review version (recommendation_id, timestamp_updated).
      - name: steam_news
      - name: news_classification
      - name: steam_price
      - name: steam_review_daily
        description: >-
          Comparison games' positive and negative reviews per UTC day (migration 0005), stored by
          the nightly counts stage for the days after the seed donor_daily_counts.
      - name: review_aspect_score
        description: >-
          Aspect scores (migration 0002): one row per review version and model version, with each
          aspect's probability (p_<code>) and label (l_<code>). Every model's scores are kept.
      - name: steam_page
        description: Raw Steam responses, personal fields removed, kept 30 days.
        config:
          # Pipeline freshness (spec §14: data at most 36 hours old).
          loaded_at_field: fetched_at
          freshness:
            warn_after: {count: 36, period: hour}
            error_after: {count: 48, period: hour}
