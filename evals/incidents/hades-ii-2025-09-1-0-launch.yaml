notes: "A 1.0 release after 16 months of early access, so the data has history before it; the window starts at 1.0, not at the first review. It ends the day before the Autumn Sale 2025 (29 September). The positive share barely moved (mid-90s before and after); what changed was volume. Seif's ruling (2 Nov 2026): good launches count as launch_performance with direction positive. Medium because the positive share didn't shift, so the case tests whether the agent recognises the release itself."
