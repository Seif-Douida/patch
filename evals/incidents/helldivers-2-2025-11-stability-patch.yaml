researched: 2026-11-04
notes: "No source ties the rise to 4.1.1 by name, and it began on 3 November, a day before the patch (151 reviews at 74%). 4.1.0 lifted the share for a day or two only. A developer blog followed on 6 November. Our counts: 1,449 reviews at 78.7% in the window vs 8,325 at 63.5% in the 28 days before; no sale."
