id: helldivers-2-2025-11-stability-patch
game: "Helldivers 2"
appid: 553850
window:
  start: 2025-11-04
  end: 2025-11-10
question: "Why did Helldivers 2's Steam reviews improve in early November 2025?"
primary_cause: patch
secondary_causes: []
direction: positive
patch:
  date: 2025-11-04
  name: "Into the Unjust: 4.1.1"
key_facts:
  - "Patch 4.1.0 on 23 October 2025 fixed over 200 bugs; Arrowhead said it had overhauled how it patches to target players' pain points."
  - "Patch 4.1.1 on 4 November 2025 fixed several crashes, reduced frame-rate stutters during the drop-in sequence and stopped unused textures loading into memory."
  - "By early December 2025 Arrowhead's CEO said the Steam score was trending upwards after the Into the Unjust backlash, crediting no single patch; recent reviews were back to Very Positive."
acceptable_evidence:
  - "the 4.1.0 and 4.1.1 patch notes"
  - "the positive share stepping up from the mid-60s to the high 70s around 4 November"
  - "the stability patches following the Into the Unjust backlash"
