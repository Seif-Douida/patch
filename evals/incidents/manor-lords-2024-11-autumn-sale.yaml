notes: "The cause rests on timing: no source says reviews rose because of the sale. Manor Lords is discounted most months without a burst, so the Steam Awards nominations running with the sale may be what drives the extra reviews; that mechanism is only sourced for 2025. Our counts: 30-60 reviews a day at 70-88% before, 218-796 a day at 95-97% in the window, about 80% again from 5 December."
