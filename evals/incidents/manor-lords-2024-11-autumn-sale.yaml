key_facts:
  - "Steam's Autumn Sale ran from 27 November to 4 December 2024, with Steam Awards nominations open at the same time."
  - "Manor Lords was 30% off in Hooded Horse's publisher sale until 4 December, at what PCGamesN called its lowest price yet."
  - "No update came out in the window; the update previewed on 23 November arrived in January 2025."
