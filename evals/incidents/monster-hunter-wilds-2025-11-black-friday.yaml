confidence: medium
researched: 2026-11-04
notes: "The patch four days earlier is a decoy: the jump starts on 24 November. No source says whether Monster Hunter Wilds was discounted on Steam. The same days lifted almost every tracked game (No Man's Sky about 9 times its volume, Clair Obscur 13). The Black Friday 2025 row is in the sale seed, but on 4 November 2026 the incremental daily mart had not rebuilt those days, so the agent sees no sale here until it does. Our counts: 4,843 reviews at 77.0% in the window vs 3,106 at 46.7% in the 28 days before. Seif's ruling (2 Nov 2026): Steam-event review bursts count as pricing_sale."
