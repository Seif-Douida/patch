window:
  start: 2025-11-24
  end: 2025-12-01
question: "Why did Monster Hunter Wilds' Steam reviews jump in late November 2025?"
primary_cause: pricing_sale
secondary_causes: []
direction: positive
key_facts:
  - "Steam ran Black Friday offers and the Steam Awards nominations together from 24 November to 1 December 2025."
  - "Valve's nominations badge rewarded reviewing, or updating a review of, a game you nominated."
  - "Capcom's last update before the window, Ver.1.030.02.02, came out on 20 November 2025."
acceptable_evidence:
  - "the Black Friday 2025 dates in the sale calendar"
  - "review volume about five times normal for exactly those days, mostly positive"
  - "the same burst across other games in the same days"
  - "no change in the four days between Ver.1.030.02.02 and the burst"
