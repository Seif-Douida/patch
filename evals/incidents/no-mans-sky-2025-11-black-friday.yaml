notes: "Depends on the Black Friday 2025 row being in the sale seed (branch fix/sale-calendar-black-friday); without it the agent sees no sale here. No source says whether No Man's Sky itself was discounted. Our counts: about 100 reviews a day at ~90-96% before, 600-2,400 a day at 99-100% in the window, about 100 a day at ~90% after. Seif's ruling (2 Nov 2026): Steam-event review bursts count as pricing_sale."
