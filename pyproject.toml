[project]
name = "patchpulse"
version = "0.1.0"
description = "Analyst agent that explains Steam review sentiment shifts and refuses to state numbers it cannot verify."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.141.1",
    "uvicorn>=0.54.0",
]

[project.scripts]
patchpulse-pipeline = "patchpulse.pipeline.cli:main"
patchpulse-ml = "patchpulse.models.cli:main"
patchpulse-agent = "patchpulse.agent.cli:main"

[build-system]
requires = ["uv_build>=0.12.19,<0.13"]
build-backend = "uv_build"

[tool.uv]
required-version = ">=0.12.19"

# PyTorch with CUDA 12.6 for the GTX 1650 (compute capability 7.5), on Windows only; elsewhere the
# `gpu` group resolves PyTorch from PyPI. Nothing but `torch` is taken from this index.
[tool.uv.sources]
torch = [{ index = "pytorch-cu126", marker = "sys_platform == 'win32'" }]

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[tool.ruff]
line-length = 100
target-version = "py312"
# Markdown code blocks are design sketches, not source; ruff must not rewrite the spec.
extend-exclude = ["*.md"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM", "N", "S", "PT", "RUF"]

[tool.ruff.lint.per-file-ignores]
# Tests may assert, run subprocesses, use throwaway passwords and build SQL from constants.
"tests/**" = ["S101", "S105", "S106", "S603", "S607", "S608"]

[tool.ruff.lint.isort]
known-first-party = ["patchpulse"]

[tool.mypy]
python_version = "3.12"
strict = true
# tests/support holds shared test helpers (fake Steam) importable by test modules.
mypy_path = "src,tests/support"
files = ["src", "tests"]

[[tool.mypy.overrides]]
# torch, transformers and huggingface_hub are in the local-only gpu group: absent from CI.
module = [
    "huggingface_hub", "huggingface_hub.*", "joblib", "joblib.*", "mssql_python", "mssql_python.*",
    "onnxruntime", "onnxruntime.*", "sklearn", "sklearn.*", "statsmodels", "statsmodels.*",
    "streamlit", "streamlit.*", "torch", "torch.*", "transformers", "transformers.*",
]
ignore_missing_imports = true

# S1b's network subclasses torch.nn.Module; where the gpu group is absent (CI), torch is Any.
[[tool.mypy.overrides]]
module = ["patchpulse.models.s1b_train"]
disallow_subclassing_any = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-ra", "--strict-markers", "--import-mode=importlib"]
# MLflow's SQLite store uses a loader SQLAlchemy 2.1 deprecates; not ours to fix.
filterwarnings = ["ignore:The ``noload`` loader strategy is deprecated:DeprecationWarning"]
pythonpath = ["tests/support"]
markers = [
    "integration: needs the SQL Server container (skipped locally without it, required in CI)",
    "gpu: needs PyTorch with CUDA (Phase 2 training; local only, skipped wherever it's absent)",
    "qdrant: needs the Qdrant container (skipped locally without it, required in CI)",
]

[dependency-groups]
# The API image syncs without groups; the jobs image syncs `pipeline`; dev gets everything but the
# local-only Phase 2 groups (`lab`, `gpu`).
dev = [
    { include-group = "pipeline" },
    { include-group = "ml" },
    { include-group = "scoring" },
    { include-group = "retrieval" },
    { include-group = "causal" },
    { include-group = "agent" },
    "httpx2>=2.13.1",
    "mypy>=2.3.1",
    # Tests build tiny ONNX graphs as fake encoders; the jobs image doesn't need it.
    "onnx>=1.23.2",
    "pre-commit>=4.6.2",
    "pandas-stubs>=3.0.5.260914",
    "pytest>=9.1.1",
    "python-dotenv>=1.2.3",
    "ruff>=0.16.9",
    "scipy-stubs>=1.18.1.1",
    "statsmodels>=0.15.0",
    "types-pyyaml>=6.0.12.20260906",
]
# Phase 2, local only and never in dev, CI or an image: GPU embeddings and fine-tuning on the
# GTX 1650 (design D5). PyTorch comes from its CUDA index on Windows (see [tool.uv.sources]).
gpu = [
    "huggingface-hub>=2.2.0",
    "onnx>=1.23.2",
    "onnxscript>=0.7.2",
    "torch>=2.14.1",
    "transformers>=5.19.0",
]
# Phase 2, local only and never in dev or CI: Seif's labeling app (design D3).
lab = [
    "streamlit>=1.65.0",
]
# Phase 2, run on Seif's machine: the snapshot, labeling and training (design D1, D5).
ml = [
    "azure-identity>=1.26.0",
    "mlflow-skinny>=3.17.0",
    "pandas>=3.0.6",
    "pyarrow>=25.0.1",
    "scikit-learn>=1.9.1",
    "scipy>=1.18.1",
    "tzdata>=2026.4",
]
# Phase 4: the causal estimators (design D1): the nightly effects stage and the benchmark.
causal = [
    "numpy>=2.5.3",
    "scipy>=1.18.1",
]
# Phase 2: what the jobs image needs to score reviews (design D5, D8): S0 through scikit-learn,
# S1a and S1b through ONNX Runtime and tokenizers. Never PyTorch.
scoring = [
    "joblib>=1.6.0",
    "numpy>=2.5.3",
    "onnxruntime>=1.30.0",
    "scikit-learn>=1.9.1",
    "tokenizers>=0.23.2",
]
pipeline = [
    "alembic>=1.20.0",
    "dbt-core~=1.12.5",
    "dbt-sqlserver[mssql]~=1.12.0",
    "httpx2>=2.13.1",
    "mssql-python>=1.15.0",
    "pydantic-settings>=2.15.0",
    "pyjwt[crypto]>=2.15.1",
    "pyyaml>=6",
    "sqlalchemy>=2.1.1",
]
# Phase 3: the Qdrant client for the local eval, the upload and (from Milestone D) the jobs
# image's nightly index stage (design D5).
retrieval = [
    "qdrant-client>=1.19.1",
]
# Phase 5: the agent's workflow graph (ADR-005), used by the nightly reports and the API. Model
# calls go through our router, not LangChain; LangSmith tracing stays off (no LANGSMITH_* set).
agent = [
    "langgraph>=1.2.17",
]
