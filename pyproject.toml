[project]
name = "patchpulse"
version = "0.1.0"
description = "Analyst agent that explains Steam review sentiment shifts and refuses to state numbers it cannot verify."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.141.1",
    "uvicorn>=0.54.0",
]

[project.scripts]
patchpulse-pipeline = "patchpulse.pipeline.cli:main"

[build-system]
requires = ["uv_build>=0.12.19,<0.13"]
build-backend = "uv_build"

[tool.uv]
required-version = ">=0.12.19"

[tool.ruff]
line-length = 100
target-version = "py312"
# Markdown code blocks are design sketches, not source; ruff must not rewrite the spec.
extend-exclude = ["*.md"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM", "N", "S", "PT", "RUF"]

[tool.ruff.lint.per-file-ignores]
# Tests may assert, run subprocesses, use throwaway passwords and build SQL from constants.
"tests/**" = ["S101", "S105", "S106", "S603", "S607", "S608"]

[tool.ruff.lint.isort]
known-first-party = ["patchpulse"]

[tool.mypy]
python_version = "3.12"
strict = true
# tests/support holds shared test helpers (fake Steam) importable by test modules.
mypy_path = "src,tests/support"
files = ["src", "tests"]

[[tool.mypy.overrides]]
module = ["mssql_python", "mssql_python.*", "statsmodels", "statsmodels.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-ra", "--strict-markers", "--import-mode=importlib"]
pythonpath = ["tests/support"]
markers = [
    "integration: needs the SQL Server container (skipped locally without it, required in CI)",
]

[dependency-groups]
# The API image syncs without groups; the jobs image syncs `pipeline`; dev gets everything.
dev = [
    { include-group = "pipeline" },
    "httpx2>=2.13.1",
    "mypy>=2.3.1",
    "pre-commit>=4.6.2",
    "pytest>=9.1.1",
    "python-dotenv>=1.2.3",
    "ruff>=0.16.9",
    "statsmodels>=0.15.0",
    "types-pyyaml>=6.0.12.20260906",
]
pipeline = [
    "alembic>=1.20.0",
    "dbt-core~=1.12.5",
    "dbt-sqlserver[mssql]~=1.12.0",
    "httpx2>=2.13.1",
    "mssql-python>=1.15.0",
    "pydantic-settings>=2.15.0",
    "pyyaml>=6",
    "sqlalchemy>=2.1.1",
]
